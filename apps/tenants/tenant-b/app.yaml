apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-web
  namespace: tenant-b
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>tenant-b</title></head>
      <body>
        <h1>tenant-b</h1>
        <p>This workload is managed by the tenant workload ApplicationSet.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-web
  namespace: tenant-b
  labels:
    app: tenant-web
    tenant: tenant-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-web
  template:
    metadata:
      labels:
        app: tenant-web
        tenant: tenant-b
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          volumeMounts:
            - name: tenant-web
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: tenant-web
          configMap:
            name: tenant-web
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-web
  namespace: tenant-b
spec:
  selector:
    app: tenant-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenant-web
  namespace: tenant-b
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.tenant-b.127.0.0.1.nip.io
      secretName: tenant-b-tls
  rules:
    - host: app.tenant-b.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tenant-web
                port:
                  name: http
