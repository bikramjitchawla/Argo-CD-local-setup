apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kind-app-workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: oauth
            repoURL: https://github.com/bikramjitchawla/Kubernetes-cluster-development.git
            targetRevision: main
            namespace: oauth
            path: Oauth
            include: '{installation.yaml,ingress.yaml}'
          - name: pg-vector
            repoURL: https://github.com/bikramjitchawla/pg-vector.git
            targetRevision: main
            namespace: vector-db
            path: .
            include: '{01-cnpg-operator.yaml,cnpg-operator.yaml,pgvector-cluster.yaml,pgvector-nodeport.yaml}'
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: default
      source:
        repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .targetRevision }}'
        path: '{{ .path }}'
        directory:
          include: '{{ .include }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kind-tenant-platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: tenant-a-platform
            namespace: tenant-a
            path: platform/tenants/tenant-a
          - name: tenant-b-platform
            namespace: tenant-b
            path: platform/tenants/tenant-b
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/bikramjitchawla/Argo-CD-local-setup.git
        targetRevision: main
        path: '{{ .path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kind-tenant-workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: tenant-a-workloads
            namespace: tenant-a
            path: apps/tenants/tenant-a
          - name: tenant-b-workloads
            namespace: tenant-b
            path: apps/tenants/tenant-b
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/bikramjitchawla/Argo-CD-local-setup.git
        targetRevision: main
        path: '{{ .path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
